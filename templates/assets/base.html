{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kishan Hub - Agricultural Tools Rental</title>
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet" />
    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/img/logo.jpg' %}"
    />
    <link rel="apple-touch-icon" href="{% static 'assets/img/logo.jpg' %}" />
  </head>
  <body>
    {% include 'assets/navbar.html' %} {% block content %} {% endblock %}

    <!-- Floating Chat Button + Popup with Quick Suggestion Buttons -->
    <style>
      #chatFloatingBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 16px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        z-index: 1000;
        transition: transform 0.2s;
      }
      #chatFloatingBtn:hover {
        transform: scale(1.1);
      }

      #chatPopup {
        display: none;
        position: fixed;
        bottom: 80px;
        right: 20px;
        width: 360px;
        max-height: 550px;
        border-radius: 10px;
        background: white;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        flex-direction: column;
        z-index: 1000;
        animation: fadeIn 0.3s;
        display: flex;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      #chatPopupHeader {
        background-color: #4caf50;
        color: white;
        padding: 10px;
        font-weight: bold;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #chatboxContent {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        border-bottom: 1px solid #ccc;
      }
      #quickButtons {
        display: flex;
        flex-wrap: wrap;
        padding: 5px 10px;
      }
      .quickBtn {
        background-color: #e0f2f1;
        border: none;
        margin: 3px;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
      }
      .quickBtn:hover {
        background-color: #b2dfdb;
      }

      #chatInputWrapper {
        display: flex;
        padding: 10px;
      }
      #chatInput {
        flex: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      #chatSendBtn {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 8px 12px;
        margin-left: 5px;
        border-radius: 5px;
        cursor: pointer;
      }
      #typingIndicator {
        font-size: 12px;
        color: #999;
        display: none;
      }
    </style>

    <button id="chatFloatingBtn">💬</button>

    <div id="chatPopup">
      <div id="chatPopupHeader">
        AI Help Center
        <span style="cursor: pointer" onclick="toggleChat()">✖</span>
      </div>
      <div id="chatboxContent"></div>
      <div id="quickButtons">
        <button class="quickBtn" onclick="sendQuickMessage('Available Tools')">
          Available Tools
        </button>
        <button
          class="quickBtn"
          onclick="sendQuickMessage('How to Rent a Tool?')"
        >
          How to Rent a Tool?
        </button>
        <button class="quickBtn" onclick="sendQuickMessage('Payment Options')">
          Payment Options
        </button>
        <button
          class="quickBtn"
          onclick="sendQuickMessage('Sign-up/Login Help')"
        >
          Sign-up/Login Help
        </button>
      </div>
      <div id="typingIndicator">AI is typing...</div>
      <div id="chatInputWrapper">
        <input
          type="text"
          id="chatInput"
          placeholder="Ask about signup, tools, rentals..."
        />
        <button id="chatSendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
      const chatBtn = document.getElementById("chatFloatingBtn");
      const chatPopup = document.getElementById("chatPopup");
      const chatbox = document.getElementById("chatboxContent");
      const chatInput = document.getElementById("chatInput");
      const typingIndicator = document.getElementById("typingIndicator");
      const toolButtonsDiv = document.getElementById("quickButtons");

      // Toggle chat popup
      chatBtn.addEventListener("click", toggleChat);
      function toggleChat() {
        chatPopup.style.display =
          chatPopup.style.display === "flex" ? "none" : "flex";
      }

      // Send message to backend
      async function sendMessage(message = null) {
        const userMessage = message || chatInput.value.trim();
        if (!userMessage) return;

        // Show user message
        chatbox.innerHTML += `<div><b>You:</b> ${userMessage}</div>`;
        chatInput.value = "";
        chatbox.scrollTop = chatbox.scrollHeight;
        typingIndicator.style.display = "block";

        try {
          const response = await fetch("{% url 'chatbot' %}", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": "{{ csrf_token }}",
            },
            body: JSON.stringify({ message: userMessage }),
          });

          const data = await response.json();

          // Show AI answer
          chatbox.innerHTML += `<div><b>AI:</b> ${data.answer}</div>`;
          typingIndicator.style.display = "none";
          chatbox.scrollTop = chatbox.scrollHeight;

          // Render available tools dynamically as buttons
          renderToolButtons(data.available_tools || []);
        } catch (error) {
          console.error("Chat error:", error);
          chatbox.innerHTML += `<div><b>AI:</b> Sorry, something went wrong. Try again.</div>`;
          typingIndicator.style.display = "none";
          chatbox.scrollTop = chatbox.scrollHeight;
        }
      }

      // Quick buttons click handler
      function sendQuickMessage(msg) {
        sendMessage(msg);
      }

      // Render clickable tool buttons
      function renderToolButtons(tools) {
        toolButtonsDiv.innerHTML = ""; // clear previous buttons
        tools.forEach((tool) => {
          const btn = document.createElement("button");
          btn.className = "quickBtn";
          btn.textContent = tool;
          btn.onclick = () => sendMessage(`Tell me more about ${tool}`);
          toolButtonsDiv.appendChild(btn);
        });
      }

      // Send message on Enter key
      chatInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          e.preventDefault(); // prevent form submission if any
          sendMessage();
        }
      });
    </script>

    {% include 'assets/footer.html' %} {% include 'assets/login_model.html' %}
    {% include 'assets/register_model.html' %}

    <script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'assets/js/script.js' %}"></script>
  </body>
</html>
